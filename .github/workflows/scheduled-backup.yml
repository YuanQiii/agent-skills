name: 定时备份
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 显示时间
        run: |
          echo "📅 执行时间 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"

      - name: 统计数据
        id: stats
        run: |
          SKILLS_COUNT=$(ls -1 skills/ 2>/dev/null | wc -l)
          SKILL_MD_COUNT=$(find skills/ -name 'SKILL.md' 2>/dev/null | wc -l)
          echo "📊 Skills 统计:"
          echo "   - Skills 目录数: $SKILLS_COUNT"
          echo "   - SKILL.md 文件数: $SKILL_MD_COUNT"
          echo "skills_count=$SKILLS_COUNT" >> $GITHUB_OUTPUT
          echo "skill_md_count=$SKILL_MD_COUNT" >> $GITHUB_OUTPUT

      - name: 检查远程更新
        run: |
          echo "🔍 检查远程仓库更新..."
          git fetch origin

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/${{ github.ref_name }})

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "ℹ️  本地和远程已是最新"
          else
            echo "⚠️  远程有更新，可能需要拉取"
            echo "   本地: $LOCAL"
            echo "   远程: $REMOTE"
          fi

      - name: 验证 skills 完整性
        continue-on-error: true
        run: |
          echo "🔍 验证 skills 目录完整性..."
          EMPTY_DIRS=$(find skills/ -maxdepth 1 -type d -empty 2>/dev/null)
          if [ -n "$EMPTY_DIRS" ]; then
            echo "⚠️  发现空目录:"
            echo "$EMPTY_DIRS"
          else
            echo "✅ 所有 skills 目录非空"
          fi

          MISSING_SKILL_MD=""
          for dir in skills/*/; do
            if [ ! -f "${dir}SKILL.md" ]; then
              MISSING_SKILL_MD="${MISSING_SKILL_MD}\n   - ${dir}"
            fi
          done

          if [ -n "$MISSING_SKILL_MD" ]; then
            echo "⚠️  以下目录缺少 SKILL.md:"
            echo -e "$MISSING_SKILL_MD"
          else
            echo "✅ 所有 skills 目录包含 SKILL.md"
          fi

      - name: 显示最近活动
        run: |
          echo "📝 最近提交记录:"
          git log --oneline -10
